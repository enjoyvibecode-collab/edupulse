<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <drop-shadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Smooth Rounded Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="8" y="8" width="176" height="176" rx="34" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" />

  <g transform="translate(0, -4)" filter="url(#glow)">
    <!-- Mortarboard Hat (Education) -->
    <path d="M96 52 L150 74 L96 96 L42 74 Z" fill="url(#pulseGrad)" />
    <path d="M68 84.5 L68 114 C68 126 124 126 124 114 L124 84.5" fill="none" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M136 78 L136 108" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="136" cy="108" r="4.5" fill="#34d399" />
    
    <!-- Heart Rate Pulse (Pulse/Live Tracking) -->
    <path d="M46 138 L72 138 L80 114 L88 154 L96 126 L102 142 L110 132 L118 138 L146 138" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
